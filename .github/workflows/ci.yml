name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  contracts:
    name: Soroban contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts -> target

      # agent-vault imports policy_engine.wasm at compile time, so this must run
      # before clippy/tests that build the full crate graph.
      - name: Build contracts to wasm
        run: bash scripts/build-contracts.sh

      - name: Format check
        run: cargo fmt --manifest-path contracts/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path contracts/Cargo.toml --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --manifest-path contracts/Cargo.toml

  typescript:
    name: TypeScript packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:ts

      - name: Lint
        run: npm run lint:ts

      - name: Test
        run: npm run test:ts

  testnet-e2e:
    name: Testnet deploy + e2e spend
    runs-on: ubuntu-latest
    needs: [contracts, typescript]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      STELLAR_NETWORK: testnet
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: 30.0.1
        run: |
          set -euo pipefail
          url="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL -o /tmp/stellar-cli.tar.gz "$url"
          sudo tar -xzf /tmp/stellar-cli.tar.gz -C /usr/local/bin stellar
          stellar --version

      - name: Deploy contracts to Testnet
        run: bash contracts/deploy.sh

      - name: Run end-to-end spend
        run: npm run test:e2e
