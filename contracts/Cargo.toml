[workspace]
members = [
    "agent-vault",
    "policy-engine",
    "registry",
]
resolver = "2"

[workspace.dependencies]
# NOTE: do not enable "testutils" here — that feature is rejected on the wasm
# target and would break every `cargo build --target wasm32-unknown-unknown`.
# Each contract opts in to it from its own [dev-dependencies] instead.
soroban-sdk = "21.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
